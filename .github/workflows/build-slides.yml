name: Build Sermon Slide Manifest

on:
  push:
    paths:
      - "Sermon/**"
      - "Scripts/build_manifest.py"
      - ".github/workflows/build-slides.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate slides.json
        run: python Scripts/build_manifest.py

      - name: Commit updated slides.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Sermon/slides.json

          if git diff --cached --quiet; then
            echo "No changes to slides.json"
          else
            git commit -m "Update sermon slide manifest"
            git push
          fi
